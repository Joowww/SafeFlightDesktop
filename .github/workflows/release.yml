name: Release (draft)

# Pushing a tag such as v0.3.0 rebuilds every target and attaches the
# artefacts to a DRAFT GitHub release for manual review. Packages are not
# code-signed and the macOS app is not notarized; the release text says so.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    uses: ./.github/workflows/desktop.yml

  android:
    uses: ./.github/workflows/android.yml

  draft-release:
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: artifacts/*
          body: |
            Automated build of ${{ github.ref_name }}.

            * Desktop packages: Windows x64, Linux x64, macOS arm64 and macOS x64.
            * Android: debug APK (not signed for production).
            * Packages are **not code-signed** and the macOS app is **not notarized**:
              Gatekeeper and SmartScreen will warn on first launch.
            * Each artefact has a `.build-report.json` with tests, smoke test and SHA-256.
            * A successful CI build is not a functional validation on hardware; see
              docs/evaluation/validation-matrix.md.
