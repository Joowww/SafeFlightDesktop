name: Android build

# Runs the Android unit tests (including the MAVLink vectors shared with
# Desktop), Android Lint and builds the debug APK through `python build.py`.
# No signing keys are used: the artefact is a debug build.
on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "android/**"
      - "shared/**"
      - "VERSION"
      - "build.py"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "shared/**"
      - "VERSION"
      - "build.py"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: debug-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Unit tests, lint and debug APK
        run: python build.py --target android

      - name: Upload APK and build report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SafeFlight-Android-debug
          path: dist/artifacts/*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SafeFlight-Android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
